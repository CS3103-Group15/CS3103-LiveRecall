<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    #live {
      height: 250px;
      overflow-y: auto;
      overflow-x: hidden;

      border: 1px solid #bbb;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;

      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    .naive-line { padding: .25rem 0; border-bottom: 1px dotted #ddd; }
    button { padding: .55rem .75rem; margin: .2rem; }
    #recall { white-space: pre-wrap; margin-top: 1rem; border-left: 3px solid #ccc; padding-left: 1rem; }
    .hint { font-size: .9rem; color: #555; }
    .caption {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .caption.provisional {
      background: #f3f4f6;
      color: #6b7280;
      font-style: italic;
    }
    .caption.final {
      background: #ecfdf5;
      color: #111827;
      font-style: normal;
    }
    #recall {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        max-height: 300px;
        overflow-y: auto;
    }
    .recall-caption {
        display: flex;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        line-height: 1.5;
    }
    .recall-caption:last-child {
        border-bottom: none;
    }
    .recall-time {
        color: #777;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    button[data-seconds] {
        cursor: pointer;
    }
    button[data-seconds]:hover {
        background: #e5e7eb;
    }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <p class="hint">Live captions update automatically.
    Recent finalized captions can be recalled locally.
    Missed captions are recovered after reconnecting.</p>
  <div id="live"></div>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">Select a time window to view recent finalized captions.</div>
  <script src="app.js"></script>
</body>
</html>
